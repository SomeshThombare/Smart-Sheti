<!DOCTYPE html>
<html>
<head>
    <title>Update Farmer Profile</title>
    <style>
        body { font-family: Arial; background:#eef7ee; margin:0; }
        .box { width:550px; margin:40px auto; background:white; padding:25px; border-radius:12px; box-shadow:0 5px 20px #ccc; }
        h2 { color:#1b5e20; text-align:center; }
        input, select, textarea { width:100%; padding:10px; margin:8px 0; border:1px solid #ccc; border-radius:6px; }
        button { width:100%; padding:12px; background:#2e7d32; color:white; border:none; border-radius:6px; font-size:16px; }
        .error { color:red; }
        .success { color:green; }
        .otp { background:#fff3cd; padding:10px; border-radius:6px; color:#856404; }
    </style>
</head>
<body>

<div class="box">
    <h2>Update Farmer Profile</h2>

    {% if message %}
        <p class="{% if success %}success{% else %}error{% endif %}">{{ message }}</p>
    {% endif %}

    {% if otp_required %}
        <p class="otp">
            OTP verification required.
            <a href="/accounts/verify-otp/">Verify OTP</a>
        </p>
    {% endif %}

    <form method="post">
        {% csrf_token %}

        {{ form.as_p }}

        <button type="submit">Update Profile</button>
    </form>
</div>

</body>
</html>
